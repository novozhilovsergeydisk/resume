<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Скриншоты тренажёра для подготовки к сертификации по PostgreSQL 16.">
  <title>Тренажёр PostgreSQL 16 — скриншоты</title>
  <link rel="icon" href="../favicon.png">
  <style>
    body {
      margin: 0;
      font: 1rem/1.5 Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    main {
      box-sizing: border-box;
      max-width: 52rem;
      padding: 1.5rem 1.25rem 2.5rem;
      margin: 0 auto;
    }
    a { color: #1f7a4d; }
    a:focus-visible { outline: 2px solid #1f7a4d; outline-offset: 3px; }
    h1 {
      margin: 0.9rem 0 0.5rem;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.15;
      color: #0f151c;
    }
    h2 {
      margin: 1.75rem 0 0.6rem;
      border-bottom: 2px solid #2f9e63;
      font-size: 1.2rem;
      line-height: 1.35;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0.35rem;
    }
  </style>
</head>
<body>
  <main>
    <a href="../">К резюме</a>
    <h1>Тренажёр PostgreSQL 16</h1>
    <p>Подготовка к сертификации по PostgreSQL 16. <a href="https://appuse.ru/">Открыть тренажёр на appuse.ru</a></p>

    <h2>Тренировка по темам</h2>
    <a href="01-training.png" aria-label="Открыть скриншот тренировки в полном размере">
      <img src="01-training.png" width="1440" height="1000"
           alt="Список тем PostgreSQL с прогрессом и кнопкой работы над ошибками">
    </a>

    <h2>Настройка пробного экзамена</h2>
    <a href="02-exam.png" aria-label="Открыть скриншот экзамена в полном размере">
      <img src="02-exam.png" width="1440" height="1000" loading="lazy"
           alt="Выбор количества вопросов и тем экзамена, расчёт времени">
    </a>

    <h2>Результаты</h2>
    <a href="03-results.png" aria-label="Открыть скриншот результатов в полном размере">
      <img src="03-results.png" width="1440" height="1000" loading="lazy"
           alt="Разделы статистики, истории тренировок и истории экзаменов">
    </a>
  </main>
</body>
</html>
